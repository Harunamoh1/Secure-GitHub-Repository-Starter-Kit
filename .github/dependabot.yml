# Dependabot version updates
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# The github-actions entry keeps the SHA-pinned actions in .github/workflows/
# up to date and works for every repository. Uncomment the ecosystems your
# project uses, and set `directory` (or `directories`) to where its manifest
# lives. Delete the rest.
#
# Security updates (PRs for vulnerable dependencies, raised outside this
# schedule) are a separate setting: Settings > Advanced Security >
# Dependabot security updates.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days after a release before proposing it, so a compromised or
    # broken release has time to be noticed and pulled. Security updates
    # ignore this delay.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

